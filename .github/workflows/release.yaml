name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  tests:
    name: Tests - ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022

          - name: Linux
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurer les dépendances
        run: dotnet restore GAIP.sln

      - name: Compiler
        run: dotnet build GAIP.sln -c Release --no-restore

      - name: Exécuter les tests
        run: dotnet test GAIP.sln -c Release --no-build


  create-release:
    name: Créer la Release GitHub
    runs-on: ubuntu-24.04
    needs: tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "G@IP $TAG" \
            --generate-notes


  publish-windows:
    name: Publication Windows x64
    runs-on: windows-2022
    needs: create-release

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publier G@IP Windows standard
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r win-x64
          -p:PublishProfile=Release

      - name: Publier G@IP Windows trimmed
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r win-x64
          -p:PublishProfile=ExperimentalTrimmed

      - name: Créer les archives Windows et leurs SHA-256
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $standard = "dist/GAIP-$env:TAG-win-x64.zip"
          Compress-Archive -Path "artifacts/Release/win-x64/GAIP.exe" -DestinationPath $standard -Force
          $standardHash = (Get-FileHash -Algorithm SHA256 $standard).Hash.ToLowerInvariant()
          "$standardHash  $([System.IO.Path]::GetFileName($standard))" | Set-Content -NoNewline "$standard.sha256"

          $trimmed = "dist/GAIP-$env:TAG-win-x64-trimmed.zip"
          Compress-Archive -Path "artifacts/ExperimentalTrimmed/win-x64/GAIP.exe" -DestinationPath $trimmed -Force
          $trimmedHash = (Get-FileHash -Algorithm SHA256 $trimmed).Hash.ToLowerInvariant()
          "$trimmedHash  $([System.IO.Path]::GetFileName($trimmed))" | Set-Content -NoNewline "$trimmed.sha256"

      - name: Ajouter les fichiers Windows à la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload $env:TAG "dist/GAIP-$env:TAG-win-x64.zip" "dist/GAIP-$env:TAG-win-x64.zip.sha256" "dist/GAIP-$env:TAG-win-x64-trimmed.zip" "dist/GAIP-$env:TAG-win-x64-trimmed.zip.sha256" --clobber


  publish-linux:
    name: Publication Linux x64
    runs-on: ubuntu-24.04
    needs: create-release

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publier G@IP Linux standard
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r linux-x64
          -p:PublishProfile=Release

      - name: Publier G@IP Linux trimmed
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r linux-x64
          -p:PublishProfile=ExperimentalTrimmed

      - name: Créer les archives Linux et leurs SHA-256
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          chmod +x artifacts/Release/linux-x64/GAIP
          tar -C artifacts/Release/linux-x64 -czf "dist/GAIP-$TAG-linux-x64.tar.gz" .
          sha256sum "dist/GAIP-$TAG-linux-x64.tar.gz" > "dist/GAIP-$TAG-linux-x64.tar.gz.sha256"

          chmod +x artifacts/ExperimentalTrimmed/linux-x64/GAIP
          tar -C artifacts/ExperimentalTrimmed/linux-x64 -czf "dist/GAIP-$TAG-linux-x64-trimmed.tar.gz" .
          sha256sum "dist/GAIP-$TAG-linux-x64-trimmed.tar.gz" > "dist/GAIP-$TAG-linux-x64-trimmed.tar.gz.sha256"

      - name: Ajouter les fichiers Linux à la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "dist/GAIP-$TAG-linux-x64.tar.gz" "dist/GAIP-$TAG-linux-x64.tar.gz.sha256" "dist/GAIP-$TAG-linux-x64-trimmed.tar.gz" "dist/GAIP-$TAG-linux-x64-trimmed.tar.gz.sha256" --clobber
