name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  validate-tag:
    name: Valider le tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      file_version: ${{ steps.version.outputs.file_version }}

    steps:
      - name: Vérifier vMAJOR.MINOR.PATCH
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Le tag doit respecter vMAJOR.MINOR.PATCH, reçu : $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file_version=$version.0" >> "$GITHUB_OUTPUT"


  tests:
    name: Tests - ${{ matrix.name }}
    needs: validate-tag

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurer les dépendances verrouillées
        run: dotnet restore GAIP.sln --locked-mode

      - name: Compiler
        run: dotnet build GAIP.sln -c Release --no-restore

      - name: Exécuter les tests
        run: dotnet test GAIP.sln -c Release --no-build


  publish-windows:
    name: Publication Windows x64
    runs-on: windows-2022
    needs:
      - validate-tag
      - tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurer les dépendances Windows verrouillées
        run: >
          dotnet restore
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -r win-x64
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:NuGetLockFilePath=packages.win-x64.lock.json
          --locked-mode

      - name: Publier G@IP Windows Release
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r win-x64
          -p:PublishProfile=Release
          -p:Version=${{ needs.validate-tag.outputs.version }}
          -p:InformationalVersion=${{ needs.validate-tag.outputs.version }}
          -p:FileVersion=${{ needs.validate-tag.outputs.file_version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          --no-restore

      - name: Préparer les exécutables pour SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-input | Out-Null
          Copy-Item "artifacts/Release/win-x64/GAIP.exe" "signing-input/GAIP.exe"

      - name: Charger les exécutables non signés
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: upload-unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gaip-windows-unsigned
          path: signing-input/
          if-no-files-found: error

      - name: Signer les exécutables Windows avec SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-windows.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing-output
          parameters: |
            version: "${{ needs.validate-tag.outputs.version }}"
            fileVersion: "${{ needs.validate-tag.outputs.file_version }}"

      - name: Vérifier la signature Authenticode
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $file = "signing-output/GAIP.exe"
          if (-not (Test-Path $file)) { throw "Exécutable signé introuvable: $file" }
          $signature = Get-AuthenticodeSignature $file
          Write-Host "$file : $($signature.Status) - $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne "Valid") { throw "Signature Authenticode invalide pour $file : $($signature.Status)" }

      - name: Préparer les fichiers Windows
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          if ($env:SIGNPATH_ENABLED -eq "true") { $source = "signing-output/GAIP.exe" }
          else {
            Write-Warning "SignPath n'est pas activé : le binaire Windows sera non signé."
            $source = "artifacts/Release/win-x64/GAIP.exe"
          }
          Copy-Item $source "package/GAIP.exe"
          $size = (Get-Item "package/GAIP.exe").Length
          if ($size -gt 36700160) { throw "Exécutable Release anormalement volumineux ($size octets) : trimming probablement inactif." }

      - name: Créer l'archive Windows
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "package/GAIP.exe" -DestinationPath "dist/GAIP-$env:TAG-win-x64.zip" -Force

      - name: Installer WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wix --version
          "WIX_EXE=$wix" >> $env:GITHUB_ENV

      - name: Construire le MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-msi-input | Out-Null
          $gaipExe = (Resolve-Path "package/GAIP.exe").Path
          $gaipIcon = (Resolve-Path "src/GAIP.Desktop/Assets/GAIP.ico").Path
          & $env:WIX_EXE build `
            "packaging/windows/Package.wxs" `
            -arch x64 `
            -d "Version=${{ needs.validate-tag.outputs.version }}" `
            -d "GaipExe=$gaipExe" `
            -d "GaipIcon=$gaipIcon" `
            -pdbtype none `
            -o "signing-msi-input/GAIP.msi"
          if (-not (Test-Path "signing-msi-input/GAIP.msi")) {
            throw "Le MSI n'a pas été généré."
          }

      - name: Charger le MSI non signé
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: upload-unsigned-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gaip-windows-msi-unsigned
          path: signing-msi-input/GAIP.msi
          if-no-files-found: error

      - name: Signer le MSI avec SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-msi.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing-msi-output
          parameters: |
            version: "${{ needs.validate-tag.outputs.version }}"
            fileVersion: "${{ needs.validate-tag.outputs.file_version }}"

      - name: Vérifier la signature Authenticode du MSI
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $file = "signing-msi-output/GAIP.msi"
          if (-not (Test-Path $file)) { throw "MSI signé introuvable: $file" }
          $signature = Get-AuthenticodeSignature $file
          Write-Host "$file : $($signature.Status) - $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne "Valid") {
            throw "Signature Authenticode invalide pour le MSI : $($signature.Status)"
          }

      - name: Finaliser le MSI
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          $destination = "dist/GAIP-$env:TAG-win-x64.msi"
          if ($env:SIGNPATH_ENABLED -eq "true") {
            Copy-Item "signing-msi-output/GAIP.msi" $destination
          }
          else {
            Write-Warning "SignPath n'est pas activé : le MSI sera non signé."
            Copy-Item "signing-msi-input/GAIP.msi" $destination
          }

      - name: Conserver les fichiers Windows pour la Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error


  publish-linux:
    name: Publication Linux x64
    runs-on: ubuntu-24.04
    needs:
      - validate-tag
      - tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurer les dépendances Linux verrouillées
        run: >
          dotnet restore
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -r linux-x64
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:NuGetLockFilePath=packages.linux-x64.lock.json
          --locked-mode

      - name: Publier G@IP Linux Release
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r linux-x64
          -p:PublishProfile=Release
          -p:Version=${{ needs.validate-tag.outputs.version }}
          -p:InformationalVersion=${{ needs.validate-tag.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          --no-restore

      - name: Installer les outils de packaging Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Construire DEB et RPM
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          chmod +x packaging/linux/build-packages.sh packaging/linux/gaip
          chmod +x artifacts/Release/linux-x64/GAIP
          packaging/linux/build-packages.sh "$VERSION" "artifacts/Release/linux-x64" dist

      - name: Vérifier les paquets Linux
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          dpkg-deb --info "dist/gaip_${VERSION}_amd64.deb"
          dpkg-deb --contents "dist/gaip_${VERSION}_amd64.deb" | grep -E '/usr/lib/gaip/GAIP$|/usr/bin/gaip$|/usr/share/applications/gaip.desktop$'
          rpm -qip "dist/gaip-${VERSION}-1.x86_64.rpm"
          rpm -qlp "dist/gaip-${VERSION}-1.x86_64.rpm" | grep -E '^/usr/lib/gaip/GAIP$|^/usr/bin/gaip$|^/usr/share/applications/gaip.desktop$'

      - name: Tester l'installation RPM sous AlmaLinux 8
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          docker run --rm             -v "$PWD/dist:/packages:ro"             almalinux:8             bash -lc "
              set -euo pipefail
              dnf install -y --nogpgcheck /packages/gaip-${VERSION}-1.x86_64.rpm
              rpm -q gaip
              test -x /usr/lib/gaip/GAIP
              test -x /usr/bin/gaip
            "

      - name: Créer l'archive Linux
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          chmod +x artifacts/Release/linux-x64/GAIP
          size="$(stat -c%s artifacts/Release/linux-x64/GAIP)"
          if (( size > 36700160 )); then
            echo "Exécutable Release anormalement volumineux ($size octets) : trimming probablement inactif." >&2
            exit 1
          fi
          tar -C artifacts/Release/linux-x64 -czf "dist/GAIP-$TAG-linux-x64.tar.gz" .

      - name: Conserver les fichiers Linux pour la Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          path: |
            dist/GAIP-*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error


  create-release:
    name: Publier la Release GitHub
    runs-on: ubuntu-24.04
    needs:
      - validate-tag
      - publish-windows
      - publish-linux

    steps:
      - name: Télécharger les fichiers Windows
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-windows
          path: release-assets/windows

      - name: Télécharger les fichiers Linux
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-linux
          path: release-assets/linux

      - name: Créer puis publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -type f -print | sort)
          if (( ${#files[@]} == 0 )); then
            echo "Aucun fichier à publier." >&2
            exit 1
          fi

          if existing="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$existing" == "true" ]]; then
              echo "Suppression du brouillon résiduel $TAG avant recréation."
              gh release delete "$TAG" --repo "$GH_REPO" --yes
            else
              echo "La Release $TAG existe déjà et est publiée ; arrêt par sécurité." >&2
              exit 1
            fi
          fi

          gh release create "$TAG" "${files[@]}" \
            --repo "$GH_REPO" \
            --verify-tag \
            --draft \
            --title "G@IP $TAG" \
            --notes "Code signing policy: https://github.com/LagunaPower/gaip/blob/$TAG/SIGNING.md" \
            --generate-notes

          gh release edit "$TAG" --repo "$GH_REPO" --draft=false
