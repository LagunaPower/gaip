name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  tests:
    name: Tests - ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022

          - name: Linux
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurer les dépendances
        run: dotnet restore GAIP.sln

      - name: Compiler
        run: dotnet build GAIP.sln -c Release --no-restore

      - name: Exécuter les tests
        run: dotnet test GAIP.sln -c Release --no-build


  create-release:
    name: Créer la Release GitHub
    runs-on: ubuntu-24.04
    needs: tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "G@IP $TAG" \
            --generate-notes


  publish-windows:
    name: Publication Windows x64
    runs-on: windows-2022
    needs: create-release

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publier G@IP Windows
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r win-x64
          -p:PublishProfile=Release

      - name: Créer l'archive Windows et son SHA-256
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $archive = "dist/GAIP-$env:TAG-win-x64.zip"
          Compress-Archive `
            -Path "artifacts/Release/win-x64/GAIP.exe" `
            -DestinationPath $archive `
            -Force

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" |
            Set-Content -NoNewline "$archive.sha256"

      - name: Ajouter les fichiers Windows à la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload $env:TAG `
            "dist/GAIP-$env:TAG-win-x64.zip" `
            "dist/GAIP-$env:TAG-win-x64.zip.sha256" `
            --clobber


  publish-linux:
    name: Publication Linux x64
    runs-on: ubuntu-24.04
    needs: create-release

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publier G@IP Linux
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r linux-x64
          -p:PublishProfile=Release

      - name: Créer l'archive Linux et son SHA-256
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          chmod +x artifacts/Release/linux-x64/GAIP
          tar -C artifacts/Release/linux-x64 \
            -czf "dist/GAIP-$TAG-linux-x64.tar.gz" .
          sha256sum "dist/GAIP-$TAG-linux-x64.tar.gz" \
            > "dist/GAIP-$TAG-linux-x64.tar.gz.sha256"

      - name: Ajouter les fichiers Linux à la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "dist/GAIP-$TAG-linux-x64.tar.gz" \
            "dist/GAIP-$TAG-linux-x64.tar.gz.sha256" \
            --clobber
