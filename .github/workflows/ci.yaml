name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  tests:
    name: Tests - ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Afficher la version .NET
        run: dotnet --info

      - name: Restaurer les dépendances verrouillées
        run: dotnet restore GAIP.sln --locked-mode

      - name: Compiler
        run: dotnet build GAIP.sln -c Release --no-restore

      - name: Exécuter les tests
        run: dotnet test GAIP.sln -c Release --no-build


  publish-windows:
    name: Publication Windows x64
    runs-on: windows-2022
    needs: tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurer les dépendances Windows verrouillées
        run: >
          dotnet restore
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -r win-x64
          -p:NuGetLockFilePath=packages.win-x64.lock.json
          --locked-mode

      - name: Publier G@IP Windows standard
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r win-x64
          -p:PublishProfile=Release
          --no-restore

      - name: Publier G@IP Windows trimmed
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r win-x64
          -p:PublishProfile=ExperimentalTrimmed
          -p:Version=0.0.0
          -p:InformationalVersion=0.0.0
          -p:FileVersion=0.0.0.0
          -p:IncludeSourceRevisionInInformationalVersion=false
          --no-restore

      - name: Vérifier les exécutables
        shell: pwsh
        run: |
          $files = @(
            "artifacts/Release/win-x64/GAIP.exe",
            "artifacts/ExperimentalTrimmed/win-x64/GAIP.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Exécutable introuvable: $file" }
            Get-Item $file | Select-Object Name, Length, FullName | Format-List
          }

      - name: Installer WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wix --version
          "WIX_EXE=$wix" >> $env:GITHUB_ENV

      - name: Construire et vérifier le MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/Packaging | Out-Null
          $gaipExe = (Resolve-Path "artifacts/ExperimentalTrimmed/win-x64/GAIP.exe").Path
          $gaipIcon = (Resolve-Path "src/GAIP.Desktop/Assets/GAIP.ico").Path
          & $env:WIX_EXE build `
            "packaging/windows/Package.wxs" `
            -arch x64 `
            -d "Version=0.0.0" `
            -d "GaipExe=$gaipExe" `
            -d "GaipIcon=$gaipIcon" `
            -pdbtype none `
            -o "artifacts/Packaging/GAIP-ci-win-x64.msi"
          if (-not (Test-Path "artifacts/Packaging/GAIP-ci-win-x64.msi")) {
            throw "MSI de validation introuvable"
          }
          Get-Item "artifacts/Packaging/GAIP-ci-win-x64.msi" |
            Select-Object Name, Length, FullName |
            Format-List

      - name: Publier l'artefact Windows standard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAIP-win-x64
          path: artifacts/Release/win-x64/
          if-no-files-found: error

      - name: Publier les artefacts Windows de packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAIP-win-x64-packaging
          path: |
            artifacts/ExperimentalTrimmed/win-x64/
            artifacts/Packaging/GAIP-ci-win-x64.msi
          if-no-files-found: error


  publish-linux:
    name: Publication Linux x64
    runs-on: ubuntu-24.04
    needs: tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurer les dépendances Linux verrouillées
        run: >
          dotnet restore
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -r linux-x64
          -p:NuGetLockFilePath=packages.linux-x64.lock.json
          --locked-mode

      - name: Publier G@IP Linux standard
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r linux-x64
          -p:PublishProfile=Release
          --no-restore

      - name: Publier G@IP Linux trimmed
        run: >
          dotnet publish
          src/GAIP.Desktop/GAIP.Desktop.csproj
          -c Release
          -r linux-x64
          -p:PublishProfile=ExperimentalTrimmed
          -p:Version=0.0.0
          -p:InformationalVersion=0.0.0
          -p:IncludeSourceRevisionInInformationalVersion=false
          --no-restore

      - name: Vérifier les exécutables
        run: |
          test -f artifacts/Release/linux-x64/GAIP
          test -f artifacts/ExperimentalTrimmed/linux-x64/GAIP
          ls -lh artifacts/Release/linux-x64/GAIP artifacts/ExperimentalTrimmed/linux-x64/GAIP

      - name: Installer les outils de packaging Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Construire et vérifier DEB et RPM
        run: |
          chmod +x packaging/linux/build-packages.sh packaging/linux/gaip
          chmod +x artifacts/ExperimentalTrimmed/linux-x64/GAIP
          packaging/linux/build-packages.sh 0.0.0 artifacts/ExperimentalTrimmed/linux-x64 artifacts/Packaging
          dpkg-deb --info artifacts/Packaging/gaip_0.0.0_amd64.deb
          dpkg-deb --contents artifacts/Packaging/gaip_0.0.0_amd64.deb | grep -E '/usr/lib/gaip/GAIP$|/usr/bin/gaip$|/usr/share/applications/gaip.desktop$'
          rpm -qip artifacts/Packaging/gaip-0.0.0-1.x86_64.rpm
          rpm -qlp artifacts/Packaging/gaip-0.0.0-1.x86_64.rpm | grep -E '^/usr/lib/gaip/GAIP$|^/usr/bin/gaip$|^/usr/share/applications/gaip.desktop$'

      - name: Tester l'installation RPM sous AlmaLinux 8
        run: |
          docker run --rm             -v "$PWD/artifacts/Packaging:/packages:ro"             almalinux:8             bash -lc '
              set -euo pipefail
              dnf install -y --nogpgcheck /packages/gaip-0.0.0-1.x86_64.rpm
              rpm -q gaip
              test -x /usr/lib/gaip/GAIP
              test -x /usr/bin/gaip
            '

      - name: Publier l'artefact Linux standard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAIP-linux-x64
          path: artifacts/Release/linux-x64/
          if-no-files-found: error

      - name: Publier les artefacts Linux de packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAIP-linux-x64-packaging
          path: |
            artifacts/ExperimentalTrimmed/linux-x64/
            artifacts/Packaging/*.deb
            artifacts/Packaging/*.rpm
          if-no-files-found: error


  cleanup-runs:
    name: Nettoyage des anciennes exécutions CI
    runs-on: ubuntu-24.04
    needs:
      - tests
      - publish-windows
      - publish-linux
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      actions: write
      contents: read

    steps:
      - name: Conserver uniquement les 30 dernières exécutions CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t runs < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GH_REPO/actions/workflows/ci.yaml/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .run_number, .status, (.conclusion // "en_cours")] | @tsv'
          )

          total=${#runs[@]}
          keep=$(( total < 30 ? total : 30 ))
          echo "Exécutions CI trouvées : $total"

          if (( total > 30 )); then
            to_delete=$((total - 30))
            echo "Suppression de $to_delete ancienne(s) exécution(s) CI."
            for entry in "${runs[@]:30}"; do
              read -r run_id run_number status conclusion <<< "$entry"
              echo "Suppression de CI #$run_number ($conclusion), id=$run_id"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GH_REPO/actions/runs/$run_id"
            done
          else
            echo "Aucun nettoyage nécessaire."
          fi

          success=0
          failure=0
          cancelled=0
          other=0
          newest=""
          oldest=""

          for ((index = 0; index < keep; index++)); do
            read -r run_id run_number status conclusion <<< "${runs[$index]}"
            [[ -z "$newest" ]] && newest="$run_number"
            oldest="$run_number"
            case "$conclusion" in
              success)   ((success += 1)) ;;
              failure)   ((failure += 1)) ;;
              cancelled) ((cancelled += 1)) ;;
              *)         ((other += 1)) ;;
            esac
          done

          echo
          echo "Résumé des exécutions CI conservées :"
          echo "  Nombre       : $keep"
          if (( keep > 0 )); then
            echo "  Plus récente : #$newest"
            echo "  Plus ancienne: #$oldest"
          fi
          echo "  Succès       : $success"
          echo "  Échecs       : $failure"
          echo "  Annulées     : $cancelled"
          echo "  Autres/en cours : $other"
